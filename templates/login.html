<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fleet DB - Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: "Inter", sans-serif;
            margin: 0;
            min-height: 100vh;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(700px 400px at 80% 10%, rgba(245,158,11,0.18), transparent 60%),
                radial-gradient(600px 400px at 20% 90%, rgba(251,113,133,0.15), transparent 60%),
                linear-gradient(180deg, #0b0d12, #11141b);
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            pointer-events: none;
        }
        .login-card {
            position: relative;
            background: linear-gradient(180deg, #161a23, #1c2230);
            padding: 38px 40px 32px;
            border-radius: 18px;
            border: 1px solid #2a3142;
            box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            width: 100%;
            max-width: 420px;
        }
        .login-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 18px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(245,158,11,0.6), transparent 40%, rgba(251,113,133,0.4));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .brand {
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3em;
            color: #f59e0b;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand::before {
            content: "";
            width: 28px;
            height: 2px;
            background: #f59e0b;
        }
        .login-card h2 {
            font-family: "Space Grotesk", sans-serif;
            margin: 0 0 6px;
            font-size: 28px;
            font-weight: 700;
            color: #f5f7fb;
            letter-spacing: -0.01em;
        }
        .login-card .sub {
            margin: 0 0 26px;
            color: #8b94a7;
            font-size: 14px;
        }
        .login-card label {
            display: block;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            font-weight: 500;
            color: #8b94a7;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin: 16px 0 8px;
        }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #3a4257;
            border-radius: 10px;
            font-size: 15px;
            font-family: "Inter", sans-serif;
            color: #e5e7eb;
            background: #0e121a;
            transition: border-color .15s, box-shadow .15s;
        }
        .login-card input::placeholder { color: #5a6275; }
        .login-card input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.25);
        }
        .login-card input[type="submit"] {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(180deg, #fbbf24, #f59e0b);
            color: #1a1408;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: filter .15s, box-shadow .15s, transform .05s;
            box-shadow: 0 6px 18px rgba(245,158,11,0.35);
        }
        .login-card input[type="submit"]:hover {
            filter: brightness(1.08);
            box-shadow: 0 8px 24px rgba(245,158,11,0.50);
        }
        .login-card input[type="submit"]:active { transform: translateY(1px); }

        .flash-messages { list-style: none; padding: 0; margin: 0 0 16px; }
        .flash-message {
            padding: 11px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 13.5px;
            border: 1px solid;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flash-error {
            background: rgba(248,113,113,0.10);
            color: #fecaca;
            border-color: rgba(248,113,113,0.4);
        }
        .flash-error::before { content: "✕"; color: #f87171; font-weight: 700; }
        .flash-success {
            background: rgba(52,211,153,0.10);
            color: #bbf7d0;
            border-color: rgba(52,211,153,0.35);
        }
        .flash-success::before { content: "✓"; color: #34d399; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">FLEET&nbsp;DB&nbsp;//&nbsp;CARCO</div>
        <h2>Sign in</h2>
        <p class="sub">Authenticate to access the dealership management console.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flash-messages">
            {% for category, message in messages %}
              <li class="flash-message flash-{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" placeholder="admin" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>

            <input type="submit" value="Authenticate">
        </form>
    </div>
</body>
</html>
