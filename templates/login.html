<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Company - Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1f2937 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
        }
        .login-card {
            background: #fff;
            padding: 36px 40px;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin: 0 0 4px;
            font-size: 24px;
            color: #111827;
        }
        .login-card .sub {
            margin: 0 0 24px;
            color: #6b7280;
            font-size: 14px;
        }
        .login-card label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: .04em;
            margin: 14px 0 6px;
        }
        .login-card input[type="text"],
        .login-card input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            background: #f9fafb;
            transition: border-color .15s, box-shadow .15s;
        }
        .login-card input:focus {
            outline: none;
            background: #fff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .login-card input[type="submit"] {
            width: 100%;
            margin-top: 22px;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background .15s;
        }
        .login-card input[type="submit"]:hover { background: #1d4ed8; }

        .flash-messages { list-style: none; padding: 0; margin: 0 0 16px; }
        .flash-message {
            padding: 11px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 14px;
            border-left: 4px solid;
        }
        .flash-error { background: #fef2f2; color: #991b1b; border-color: #ef4444; }
        .flash-success { background: #f0fdf4; color: #166534; border-color: #22c55e; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Welcome back</h2>
        <p class="sub">Sign in to the Car Company database app</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flash-messages">
            {% for category, message in messages %}
              <li class="flash-message flash-{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <input type="submit" value="Log in">
        </form>
    </div>
</body>
</html>
